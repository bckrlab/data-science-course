version: 1
project:
  title: Data Science Course
  authors:
    - name: bckrlab.org
  copyright: '2025'
  github: bckrlab/data-science-course
  thebe:
    binder:
      repo: bckrlab/data-science-course
      provider: github
      url: https://mybinder.org
      ref: main
  bibliography:
    - references.bib
  plugins:
    - plugins/learning-path.mjs
  exports:
    - format: pdf
      template: plain_latex_book
      output: exports/book.pdf
  toc:
    - file: index.md
    - title: Exercise 01
      children:
        - file: chapters/exercise_01/intro-to-python_tasks.ipynb
        - file: chapters/exercise_01/intro-to-python_tutorial.ipynb
        - file: chapters/exercise_01/CURVE.ipynb
site:
  options:
    favicon: favicon.ico
    logo: logo.png
    folders: true
    style: ./styles/learning-path.css
  template: book-theme

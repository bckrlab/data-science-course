        - title: Exercise 01
          children:
            - file: chapters/exercise_01/intro-to-python_tasks.ipynb
            - file: chapters/exercise_01/intro-to-python_tutorial.ipynb
            - file: chapters/exercise_01/CURVE.ipynb
        - file: chapters/exercise_02.ipynb
        - title: Exercise 03
          children:
            - file: chapters/exercise_03/pca-dimensionality-reduction.ipynb
            - file: chapters/exercise_03/kmeans-clustering.ipynb
        - title: Exercise 04
          children:
            - file: chapters/exercise_04/evaluation-metrics.ipynb
            - file: chapters/exercise_04/holdout-cross-validation.ipynb
            - file: chapters/exercise_04/reference-values-and-imbalance.ipynb
        - title: Exercise 05
          children:
            - file: chapters/exercise_05/linear-regression-basics.ipynb
            - file: chapters/exercise_05/ols-projection-geometry.ipynb
        - title: Exercise 06
          children:
            - file: chapters/exercise_06/regularization-ridge-lasso.ipynb
            - file: chapters/exercise_06/linear-vs-logistic-classification.ipynb
        - title: Exercise 07
          children:
            - file: chapters/exercise_07/mlp-foundations.ipynb
            - file: chapters/exercise_07/mlp-implementation-and-cnn.ipynb
        - file: chapters/exercise_08.ipynb
        - file: chapters/exercise_09.ipynb
        - file: chapters/exercise_10.ipynb
        - file: chapters/exercise_11.ipynb
site:
  options:
    favicon: favicon.ico
    logo: logo.png
    folders: true

name: External Link Check

on:
  schedule:
    # Monthly, 1st at 06:00 UTC. External link rot is on its own clock and
    # must not block content deploys, so this runs independently of deploy.yml.
    - cron: '0 6 1 * *'
  workflow_dispatch: {}

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install nbconvert
        run: pip install nbconvert
      - name: Check external links in notebook content
        uses: lycheeverse/lychee-action@v2
        with:
          # --preprocess converts each notebook to Markdown first (see the
          # script for why: raw .ipynb JSON confuses lychee's URL extraction).
          #
          # --exclude 'doi.org/10.1002/nme.2750': Wiley's WAF blocks automated
          # requests to this DOI with a 403 (confirmed manually, including
          # with browser-like headers; it's not a lychee/extraction issue).
          # The link itself is fine for real readers, so it's excluded here
          # instead of flagging it every run. Other doi.org links stay checked.
          args: >-
            --no-progress
            --scheme https
            --scheme http
            --preprocess ./scripts/nbconvert-stdout.sh
            --exclude 'doi\.org/10\.1002/nme\.2750'
            './chapters/**/*.ipynb'
          failIfEmpty: false
